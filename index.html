<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>welcome</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    img {
      max-width: 100%;
      max-height: 100vh;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <img src="image.png" alt="">

  <!-- background music: browsers only allow sound after the first click/tap -->
  <audio id="music" src="music.mp3" loop preload="auto"></audio>
  <script>
    const music = document.getElementById('music');
    function startMusic() {
      music.play().then(() => {
        ['pointerdown', 'click', 'touchend', 'keydown'].forEach((t) => document.removeEventListener(t, startMusic));
      }).catch(() => {});
    }
    // phones (especially iPhones) only allow sound after a full tap, so listen for all of these
    ['pointerdown', 'click', 'touchend', 'keydown'].forEach((t) => document.addEventListener(t, startMusic));
  </script>
</body>
</html>
